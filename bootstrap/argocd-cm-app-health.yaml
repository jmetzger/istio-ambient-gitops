# Damit Sync Waves zwischen Applications wirken (App of Apps), muss ArgoCD den Zustand einer
# Application bewerten koennen. Diese Pruefung ist seit ArgoCD 1.8 nicht mehr eingebaut.
# Ohne sie legt die Root-Application alle Kinder direkt nacheinander an, ohne auf "Healthy" zu warten.
# Als Patch einspielen, nicht mit "kubectl apply --server-side": das wuerde die uebrigen Felder der
# ConfigMap entfernen (gleicher Feld-Manager wie bei der Installation), ArgoCD faende sie dann nicht mehr.
#   kubectl -n argocd patch configmap argocd-cm --type merge --patch-file bootstrap/argocd-cm-app-health.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
