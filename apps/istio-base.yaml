apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  annotations:
    # CRDs werden per Server-Side Apply geschrieben, also auch so vergleichen (sonst dauerhaft OutOfSync).
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jmetzger/istio-ambient-gitops.git
    targetRevision: main
    path: charts/istio-1.31.4/base
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  ignoreDifferences:
    # istiod stellt failurePolicy nach dem Start selbst von Ignore auf Fail und traegt das CA-Bundle ein.
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.failurePolicy
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
